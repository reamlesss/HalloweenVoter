<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f4ef">
    <meta name="description" content="Vote for your favourite person at the Halloween party.">
    <meta name="referrer" content="no-referrer">
    <title>Halloweenská soutěž</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Halloween costume poll</p>
          <h1 id="page-title">Hlasování o nejlepší kostým</h1>
          <p id="connection-status" class="connection-status">Připojeno</p>
          <p id="voting-status" class="voting-status" aria-live="polite">Načítám stav hlasování</p>
        </div>
        <button id="refresh-button" class="refresh-button" type="button">Obnovit</button>
      </header>

      <section class="poll-section" aria-labelledby="entries-heading">
        <div class="section-heading">
          <h2 id="entries-heading">Hlasuj pro svého oblíbence</h2>
        </div>
        <div id="contestant-list" class="contestant-list" aria-live="polite">
          <div class="loading-card">Načítám...</div>
        </div>
        <p id="vote-message" class="vote-message" role="status" aria-live="polite"></p>
        <button id="withdraw-vote-button" class="withdraw-vote-button" type="button" hidden>
          Vrátit hlas
        </button>
      </section>

      <section class="add-section" aria-labelledby="add-heading">
        <h2 id="add-heading">Přidat soutěžícího</h2>
        <form id="contestant-form" class="contestant-form">
          <label class="sr-only" for="contestant-name">Jméno soutěžícího</label>
          <input id="contestant-name" name="name" maxlength="40" placeholder="Jméno soutěžícího" autocomplete="off" required>
          <button type="submit" class="add-button">Přidat</button>
        </form>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
